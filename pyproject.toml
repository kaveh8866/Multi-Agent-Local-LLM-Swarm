[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard-llm-swarm"
version = "0.1.0"
description = "Containerized multi-agent swarm (planner, researcher, coder, critic) orchestrated over a local Ollama or vLLM inference server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CloudGuard contributors" }]
keywords = ["multi-agent", "local-llm", "ollama", "vllm", "orchestration", "agents"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
dev = []

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
