# =============================================================================
# Persona registry
# =============================================================================
# Every persona is a declared role: a prompt template, the capabilities the
# router may delegate to, and the only tools that persona may call. Adding an
# agent is a change here plus a prompt file — no orchestrator code changes.
#
# Capabilities are matched by the delegation router when a workflow stage does
# not name a persona explicitly.

version: 1

defaults:
  temperature: 0.2
  max_tokens: 800

personas:
  - id: planner
    name: Planner
    prompt: prompts/planner.md
    capabilities: [planning, decomposition, routing]
    tools: []
    max_tokens: 600
    temperature: 0.1

  - id: researcher
    name: Researcher
    prompt: prompts/researcher.md
    capabilities: [research, synthesis, summarisation]
    tools: [text_stats]
    max_tokens: 900
    temperature: 0.3

  - id: coder
    name: Coder
    prompt: prompts/coder.md
    capabilities: [code, implementation, refactor, review]
    tools: [calculator]
    max_tokens: 1200
    temperature: 0.1

  - id: critic
    name: Critic
    prompt: prompts/critic.md
    capabilities: [review, verification, risk]
    tools: [calculator, text_stats]
    max_tokens: 800
    temperature: 0.1
